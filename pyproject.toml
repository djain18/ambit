[project]
name = "ambit"
version = "0.1.0"
description = "The operating limits for AI buyers - make a Razorpay merchant safely transactable by AI agents."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "python-dotenv>=1.0",
    "razorpay>=1.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
